syntax = "proto3";

package resdb.raft;

import "platform/proto/replica_info.proto";

// Raft message types (used as user_type in Request)
enum RaftMessageType {
  RAFT_APPEND_ENTRIES = 0;
  RAFT_APPEND_ENTRIES_RESPONSE = 1;
  RAFT_REQUEST_VOTE = 2;
  RAFT_REQUEST_VOTE_RESPONSE = 3;
}

message AppendEntries {
  int32 term = 1;
  int32 leader_id = 2;
  int32 prev_log_index = 3;
  int32 prev_log_term = 4;
  repeated bytes entries = 5;
  int32 leader_commit = 6;
}

message AppendEntriesResp {
  int32 term = 1;
  bool success = 2;
  // The highest log index that the follower has matched (for successful replies).
  int32 match_index = 3;
}

// Candidate requests a vote during elections.
message RequestVote {
  int32 term = 1;
  int32 candidate_id = 2;
  int32 last_log_index = 3;
  int32 last_log_term = 4;
}

// Follower's response to RequestVote.
message RequestVoteResp {
  int32 term = 1;
  bool vote_granted = 2;
}
